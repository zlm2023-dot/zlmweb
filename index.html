<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理健康问卷系统 · 邹林茂</title>
<meta name="description" content="PHQ-9 / GAD-7 / SWLS 心理健康问卷填写与后台管理系统">
<!-- 图表库：教育局端画跨校对比图用。加载失败也不影响其余功能 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#5B8DEF; --primary-dark:#4A90D9; --primary-soft:#EAF2FE;
  --bg:#FFFFFF; --bg-soft:#F6F8FB;
  --text:#2C3542; --text-light:#6B7686; --text-dim:#9AA4B2;
  --border:#E8EDF4;
  --ok:#3FAE8F; --ok-soft:#E7F7F1;
  --warn:#E9A23B; --warn-soft:#FDF3E2;
  --risk:#E46A6A; --risk-soft:#FCEDED;
  --radius:16px;
  --shadow:0 4px 24px rgba(91,141,239,.08);
  --shadow-hover:0 12px 32px rgba(91,141,239,.16);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg-soft);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--primary);text-decoration:none;}
img{max-width:100%;display:block;}

/* ---------- 布局 ---------- */
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px;}
.topbar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.5px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);}
.brand small{font-weight:500;color:var(--text-dim);font-size:.78rem;letter-spacing:0;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.link-btn{
  background:none;border:none;cursor:pointer;font-family:inherit;
  color:var(--text-light);font-size:.88rem;padding:7px 14px;border-radius:999px;
  transition:all .25s;
}
.link-btn:hover{background:var(--primary-soft);color:var(--primary);}

.card{
  background:#fff;border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);padding:36px;
}

/* ---------- 登录 ---------- */
.login-box{max-width:460px;margin:52px auto;}
.login-head{text-align:center;margin-bottom:30px;}
.login-avatar{
  width:92px;height:92px;border-radius:50%;margin:0 auto 16px;object-fit:cover;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--primary),0 8px 24px rgba(91,141,239,.2);
}
.login-head h1{font-size:1.6rem;font-weight:800;letter-spacing:1px;margin-bottom:6px;}
.login-head p{color:var(--text-light);font-size:.9rem;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:.88rem;font-weight:600;margin-bottom:8px;color:var(--text);}
.field label .req{color:var(--risk);margin-left:3px;}
.input{
  width:100%;padding:13px 16px;border-radius:12px;font-size:.98rem;font-family:inherit;
  border:1px solid var(--border);background:var(--bg-soft);color:var(--text);
  transition:border-color .25s,background .25s,box-shadow .25s;
}
.input:focus{
  outline:none;border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 4px var(--primary-soft);
}
.input::placeholder{color:var(--text-dim);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 28px;border-radius:999px;font-size:.96rem;font-weight:600;cursor:pointer;
  border:none;font-family:inherit;transition:all .25s;
}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(91,141,239,.26);width:100%;}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 10px 24px rgba(91,141,239,.34);}
.btn-ghost{background:#fff;color:var(--text-light);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:9px 18px;font-size:.86rem;width:auto;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;min-width:0;}
@media(max-width:460px){.field-row{flex-direction:column;gap:0;}}
.err-tip{
  color:var(--risk);font-size:.85rem;margin-top:-8px;margin-bottom:14px;
  min-height:18px;font-weight:500;
}
.notice{
  margin-top:20px;padding:14px 16px;border-radius:12px;font-size:.83rem;line-height:1.7;
  background:var(--primary-soft);color:var(--primary-dark);border:1px solid rgba(91,141,239,.18);
}
.notice b{font-weight:700;}

/* ---------- 问卷 ---------- */
.q-head{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;
  padding:18px 28px 14px;border-bottom:1px solid var(--border);
}
.q-head-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.q-title{font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px;}
.q-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.q-who{font-size:.84rem;color:var(--text-light);}
.q-who b{color:var(--primary);}
.progress{height:5px;border-radius:5px;background:var(--bg-soft);overflow:hidden;}
.progress-bar{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--primary),#8FB8F6);transition:width .4s;}

.q-body{background:#fff;border:1px solid var(--border);border-top:none;padding:24px 28px;}
.q-foot{
  background:#fff;border:1px solid var(--border);border-top:1px solid var(--border);
  border-radius:0 0 var(--radius) var(--radius);padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.hint{font-size:.85rem;color:var(--text-light);flex:1;text-align:center;}
.hint.err{color:var(--risk);font-weight:600;}

/* 量表指导语：放在题目上方，字号与字重都加重，确保学生一眼看到 */
.scale-intro{
  background:var(--primary-soft);
  border:1px solid rgba(91,141,239,.28);
  border-left:4px solid var(--primary);
  border-radius:12px;
  padding:16px 20px;
  margin-bottom:22px;
  font-size:1.06rem;
  font-weight:700;
  line-height:1.75;
  color:#3562A8;
  letter-spacing:.2px;
  box-shadow:0 2px 10px rgba(91,141,239,.10);
}
.scale-intro::before{content:'📋 ';}
.scale-intro b{font-weight:800;}
@media(max-width:560px){
  .scale-intro{font-size:1rem;padding:14px 16px;margin-bottom:18px;}
}
.q-item{padding:18px 0;border-bottom:1px dashed var(--border);}
.q-item:last-of-type{border-bottom:none;}
.q-stem{font-size:.98rem;font-weight:600;margin-bottom:12px;display:flex;gap:9px;line-height:1.65;}
.q-no{flex:none;width:24px;height:24px;border-radius:7px;font-size:.78rem;font-weight:700;background:var(--primary-soft);color:var(--primary-dark);display:inline-flex;align-items:center;justify-content:center;margin-top:2px;}
.q-item.answered .q-no{background:var(--primary);color:#fff;}
/* 选项用等宽网格：4 个选项就 4 列，7 个选项就 7 列，每行每格宽度完全一致 */
.q-opts{display:grid;gap:8px;padding-left:33px;}
.q-opts.c-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.q-opts.c-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.q-opts.c-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.q-opts.c-5{grid-template-columns:repeat(5,minmax(0,1fr));}
.q-opts.c-6{grid-template-columns:repeat(6,minmax(0,1fr));}
.q-opts.c-7{grid-template-columns:repeat(7,minmax(0,1fr));}
.q-opt{min-width:0;cursor:pointer;text-align:center;padding:10px 6px;border-radius:10px;font-size:.87rem;background:#fff;color:var(--text-light);border:1px solid var(--border);transition:all .22s;user-select:none;display:flex;align-items:center;justify-content:center;line-height:1.4;}
.q-opt:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
.q-opt.sel{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;box-shadow:0 4px 12px rgba(91,141,239,.24);}
/* 7 个选项时格子较窄，适当收字号，保证「完全不同意」这类长文字不挤爆 */
.q-opts.c-7 .q-opt{font-size:.8rem;padding:10px 4px;letter-spacing:-.2px;}
/* 窄屏放不下 7 列，改为整行单列纵向排列（每格仍然等宽，不会出现 5+2 的断行） */
@media(max-width:760px){
  .q-opts.c-2,.q-opts.c-3,.q-opts.c-4,.q-opts.c-5,.q-opts.c-6,.q-opts.c-7{grid-template-columns:1fr;}
  .q-opts{padding-left:0;}
  .q-opt{justify-content:flex-start;text-align:left;padding:11px 14px;font-size:.87rem;letter-spacing:0;}
  .q-body,.q-head,.q-foot{padding-left:16px;padding-right:16px;}
  .card{padding:24px 20px;}
}

/* ---------- 结果 ---------- */
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
@media(max-width:700px){.res-grid{grid-template-columns:1fr;}}
.res-card{padding:20px 18px;border-radius:14px;border:1px solid var(--border);background:var(--bg-soft);text-align:center;}
.rc-name{font-size:.86rem;color:var(--text-light);margin-bottom:6px;}
.rc-score{font-size:2rem;font-weight:800;line-height:1.2;}
.rc-score small{font-size:.85rem;font-weight:600;color:var(--text-light);}
.rc-level{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;font-size:.82rem;font-weight:700;}
.rc-bar{height:6px;border-radius:6px;background:#fff;margin-top:12px;overflow:hidden;border:1px solid var(--border);}
.rc-bar i{display:block;height:100%;border-radius:6px;transition:width .8s;}
.rc-range{font-size:.74rem;color:var(--text-light);margin-top:6px;}
.lv-ok{background:var(--ok-soft);color:var(--ok);}
.lv-warn{background:var(--warn-soft);color:var(--warn);}
.lv-risk{background:var(--risk-soft);color:var(--risk);}
.alert-box{padding:20px;border-radius:14px;margin-bottom:18px;border:1px solid;}
.alert-box.a-none{background:var(--ok-soft);border-color:rgba(63,174,143,.28);}
.alert-box.a-3{background:var(--warn-soft);border-color:rgba(233,162,59,.32);}
.alert-box.a-2{background:#FDEEE4;border-color:rgba(230,140,90,.32);}
.alert-box.a-1{background:var(--risk-soft);border-color:rgba(228,106,106,.32);}
.alert-box h4{font-size:1.02rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.alert-box p{font-size:.92rem;line-height:1.75;}
.a-none .ab-title{color:var(--ok);} .a-3 .ab-title{color:#C98A22;} .a-2 .ab-title{color:#D97A45;} .a-1 .ab-title{color:var(--risk);}
.ab-badge{margin-left:auto;padding:3px 12px;border-radius:999px;background:#fff;font-size:.78rem;font-weight:700;}
.crisis-box{background:var(--risk-soft);border:1px solid rgba(228,106,106,.35);border-radius:14px;padding:20px;margin-bottom:18px;}
.crisis-box h4{color:var(--risk);font-size:1.02rem;font-weight:800;margin-bottom:10px;}
.crisis-box p{font-size:.92rem;line-height:1.8;}
.hotline{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.hotline span{padding:9px 16px;border-radius:10px;background:#fff;border:1px solid rgba(228,106,106,.28);font-size:.86rem;font-weight:700;color:var(--risk);}
.advice{background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;}
.advice h4{font-size:1rem;margin-bottom:10px;}
.advice ul{list-style:none;}
.advice li{position:relative;padding-left:20px;font-size:.92rem;color:var(--text-light);margin-bottom:7px;line-height:1.7;}
.advice li::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--primary);}
.disclaim{font-size:.83rem;color:var(--text-light);line-height:1.8;padding:16px;border-radius:12px;background:#fff;border:1px dashed var(--border);}
.disclaim b{color:var(--text);}

/* ---------- 管理后台 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
@media(max-width:820px){.chart-grid{grid-template-columns:1fr;}}
.alert-sum{
  padding:14px 18px;border-radius:12px;margin-bottom:16px;font-size:.9rem;line-height:1.8;
  background:var(--primary-soft);border:1px solid rgba(91,141,239,.2);color:var(--primary-dark);
}
.alert-sum b{font-weight:800;font-size:1.05rem;}
.std-tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px;}
.std-tbl th{background:#fff;}
.std-tbl td{white-space:normal;}
.stat{padding:18px 12px;border-radius:12px;background:var(--bg-soft);border:1px solid var(--border);text-align:center;}
.stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.3;}
.stat small{font-size:.8rem;color:var(--text-light);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.toolbar .input{flex:1;min-width:180px;padding:10px 14px;font-size:.9rem;}
.table-box{border:1px solid var(--border);border-radius:12px;overflow-x:auto;background:#fff;}
table{width:100%;border-collapse:collapse;font-size:.87rem;min-width:720px;}
th{background:var(--bg-soft);padding:11px 12px;text-align:left;font-weight:700;color:var(--text-light);white-space:nowrap;border-bottom:1px solid var(--border);}
td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;transition:background .2s;}
tbody tr:hover{background:var(--primary-soft);}
.tag{padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;}
.tag-1{background:var(--risk-soft);color:var(--risk);}
.tag-2{background:#FDEEE4;color:#D97A45;}
.tag-3{background:var(--warn-soft);color:#C98A22;}
.tag-0{background:var(--ok-soft);color:var(--ok);}
.empty{padding:44px 20px;text-align:center;color:var(--text-dim);font-size:.9rem;}
.sub-line{font-size:.76rem;color:var(--text-dim);font-weight:400;margin-top:2px;}
.badge-risk{padding:2px 8px;border-radius:6px;background:var(--risk-soft);color:var(--risk);font-size:.74rem;font-weight:700;margin-left:6px;}
.modal{position:fixed;inset:0;z-index:200;background:rgba(28,36,50,.45);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal.open{opacity:1;pointer-events:auto;}
.modal-box{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:28px;transform:translateY(14px);transition:transform .3s;}
.modal.open .modal-box{transform:none;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;}
.modal-head h3{font-size:1.15rem;font-weight:800;}
.modal-head p{font-size:.85rem;color:var(--text-light);margin-top:4px;}
.detail-sec{margin-bottom:16px;}
.detail-sec h5{font-size:.88rem;font-weight:700;margin-bottom:8px;color:var(--text-light);}
.detail-sec .row{font-size:.86rem;color:var(--text-light);padding:5px 0;border-bottom:1px dashed var(--border);display:flex;gap:10px;}
.detail-sec .row:last-child{border-bottom:none;}
.detail-sec .row i{font-style:normal;color:var(--primary);font-weight:700;flex:none;min-width:22px;}

/* ---------- 部署说明 ---------- */
.deploy{margin-top:26px;border:1px dashed var(--border);border-radius:14px;background:#fff;overflow:hidden;}
.deploy summary{padding:16px 20px;cursor:pointer;font-weight:700;font-size:.95rem;list-style:none;display:flex;align-items:center;gap:8px;}
.deploy summary::-webkit-details-marker{display:none;}
.deploy summary:hover{background:var(--primary-soft);color:var(--primary);}
.deploy-body{padding:0 20px 20px;font-size:.88rem;line-height:1.85;color:var(--text-light);}
.deploy-body h5{color:var(--text);font-size:.92rem;margin:14px 0 6px;}
.deploy-body ol,.deploy-body ul{padding-left:20px;margin-bottom:8px;}
.deploy-body code{background:var(--bg-soft);padding:2px 7px;border-radius:5px;font-size:.82rem;color:var(--primary-dark);font-family:ui-monospace,Menlo,Consolas,monospace;}
pre{background:#2C3542;color:#E8EDF4;padding:16px;border-radius:10px;overflow-x:auto;font-size:.78rem;line-height:1.7;font-family:ui-monospace,Menlo,Consolas,monospace;margin:8px 0 14px;}
.copy-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:.82rem;cursor:pointer;font-family:inherit;font-weight:600;}
.copy-btn:hover{background:var(--primary-dark);}
.mode-tip{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:18px;line-height:1.7;}
.mode-local{background:var(--warn-soft);color:#A9761F;border:1px solid rgba(233,162,59,.3);}
.mode-cloud{background:var(--ok-soft);color:#2E8A72;border:1px solid rgba(63,174,143,.3);}

.foot-note{text-align:center;font-size:.82rem;color:var(--text-dim);margin-top:24px;line-height:1.8;}

@media(max-width:600px){
  .wrap{padding:20px 12px 40px;}
  .q-who{display:none;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>心理健康问卷 <small>· 邹林茂</small></div>
  <div class="topbar-right">
    <button class="link-btn" id="btnAdmin">管理后台</button>
    <button class="link-btn" id="btnHome" style="display:none">返回首页</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div><h3 id="mTitle">详情</h3><p id="mSub"></p></div>
      <button class="link-btn" id="mClose">✕</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==========================================================
   量表定义 + 计分标准
   ========================================================== */
var OPT4 = [
  {t:'没有',      v:0},
  {t:'一天或几天', v:1},
  {t:'七天以上',   v:2},
  {t:'几乎每天',   v:3}
];
var OPT7 = [
  {t:'完全不同意',   v:1},{t:'大部分不同意', v:2},{t:'有些不同意',   v:3},
  {t:'不确定',      v:4},{t:'有些同意',     v:5},{t:'大部分同意',   v:6},
  {t:'完全同意',     v:7}
];

/* 量表默认定义（服务端未返回时的兜底，含三套标准量表的指导语） */
var DEFAULT_SCALES = [
  { key:'phq9', name:'抑郁', short:'PHQ-9', max:27, base:9, opt:4, standard:true,
    intro:'在最近两周中，你有多少天出现过以下情况？请根据你的实际情况，选出最符合你的选项。',
    opts:OPT4,
    items:['做事时提不起劲或没有兴趣。','感到心情低落、沮丧或绝望。','入睡困难、睡不安稳或睡眠过多。',
      '感觉疲倦或没有活力。','食欲不振或吃太多。','觉得自己很糟，或觉得自己是失败者，或让自己或家人失望。',
      '对事物专注有困难，例如阅读报纸或看电视时。','动作或说话速度缓慢到别人已经察觉？或正好相反——烦躁坐立不安、动来动去的情况更胜于平常。',
      '有不如死掉或用某种方式伤害自己的念头。'] },
  { key:'gad7', name:'焦虑', short:'GAD-7', max:21, base:7, opt:4, standard:true,
    intro:'在最近两周中，你有多少天出现过以下情况？请你根据实际情况，选出最符合的选项。',
    opts:OPT4,
    items:['感觉紧张、焦虑或急切。','不能停止或控制担忧。','对各种各样的事情担忧过多。','很难放松下来。',

/* 量表整体由服务端下发（教育局可导入整套量表），本地只留兜底 */
function optsOf(n){ return n === 7 ? OPT7 : OPT4; }
function maxOf(sc){ return sc.opt === 7 ? sc.items.length * 7 : sc.items.length * 3; }
function applyScales(list){
  if(!Array.isArray(list) || !list.length) return;
  SCALES = list.map(function(s){
    return {
      key: s.key,
      name: s.name,
      short: s.short,
      base: s.base || (s.items ? s.items.length : 0),
      opt: s.opt === 7 ? 7 : 4,
      intro: s.intro || '',
      standard: !!s.standard,
      opts: optsOf(s.opt),
      items: (s.items || []).map(function(x){ return x.title; }),
      qids:  (s.items || []).map(function(x){ return x.id; }),
      flags: (s.items || []).map(function(x){ return x.flag || ''; }),
      max: 0
    };
  });
  SCALES.forEach(function(sc){ sc.max = maxOf(sc); });
}
/* 取某条答卷的题面：优先用它自带的题目快照（历史答卷不受后续导入影响） */
function textsOf(r, key){
  if(r && r.qtext && Array.isArray(r.qtext[key]) && r.qtext[key].length) return r.qtext[key];
  var sc = scaleOf(key);
  return (sc && sc.items) || [];
}
function scaleOf(key){
  var a = SCALES.filter(function(x){ return x.key === key; });
  return a[0] || null;
}

/* 预警：SWLS 5–19 且 GAD 10–21 且 PHQ 10–27 同时满足 */
/* ★★★ 心理健康预警筛查标准（严格依据调研报告正文第二部分）★★★
   第一步：判断是否预警对象 —— 必须【同时满足】以下两个条件
     条件①  生活满意度(SWLS) 得分为 5～19 分
     条件②  焦虑(GAD-7) 得分为 10～21 分，且 抑郁(PHQ-9) 得分为 10～27 分
   两个条件缺一不可，否则不算预警对象。

   第二步：对预警对象按焦虑、抑郁得分细分三档
     三级：焦虑 10～14 且 抑郁 10～14
     二级：焦虑 10～14 且 抑郁 15～27 ，或 焦虑 15～21 且 抑郁 10～14
     一级：焦虑 15～21 且 抑郁 15～27
   返回值：0=非预警对象，1/2/3=一/二/三级预警 */
/* 预警判定参数：由服务端下发，教育局可在后台调整。
   未取到配置前先用默认口径，保证页面能正常渲染。 */
var ALERT_CFG = {
  /* 等级分级阈值 */
  phqModerate: 9, phqSevere: 14,
  gadMild: 4, gadModerate: 9, gadSevere: 14,
  swlsLow: 19, swlsNeutral: 20,
  /* 预警筛查区间 */
  swlsMin: 5, swlsMax: 19,
  gadMin: 10, gadMax: 21,
  phqMin: 10, phqMax: 27,
  gadHigh: 15, phqHigh: 15
};
var ALERT_KEYS = Object.keys(ALERT_CFG);
function applyAlertConfig(c){
  if(!c) return;
  ALERT_KEYS.forEach(function(k){ var v = Number(c[k]); if(isFinite(v)) ALERT_CFG[k] = v; });
  buildAlertStd();   // 参数变了，说明文案也要跟着变
}
function judgeAlert(phq,gad,swls){
  var c = ALERT_CFG;
  // —— 条件①：生活满意度落在筛查区间
  var cond1 = (swls >= c.swlsMin && swls <= c.swlsMax);
  // —— 条件②：焦虑落在区间 且 抑郁落在区间
  var cond2 = (gad >= c.gadMin && gad <= c.gadMax) && (phq >= c.phqMin && phq <= c.phqMax);

  // 两个条件没有同时满足 → 不是预警对象
  if(!(cond1 && cond2)) return 0;

  var gHi = gad >= c.gadHigh, pHi = phq >= c.phqHigh;
  var gLo = gad <  c.gadHigh, pLo = phq <  c.phqHigh;

  if(gHi && pHi) return 1;                    // 双高 → 一级
  if((gLo && pHi) || (gHi && pLo)) return 2;  // 一高一低 → 二级
  return 3;                                   // 其余 → 三级
}

/* 预警等级的详细说明（供结果页与后台共用，保证口径一致）
   条件文案按当前 ALERT_CFG 动态生成，教育局改了阈值，说明也跟着变。 */
function rng(a,b){ return a + '～' + b + ' 分'; }
function buildAlertStd(){
  var c = ALERT_CFG;
  var gLo = [c.gadMin, Math.max(c.gadMin, c.gadHigh - 1)];
  var gHi = [c.gadHigh, c.gadMax];
  var pLo = [c.phqMin, Math.max(c.phqMin, c.phqHigh - 1)];
  var pHi = [c.phqHigh, c.phqMax];
  ALERT_STD = {
    1:{ t:'一级预警', c:'a-1', cls:'lv-risk',
        cond:'焦虑 ' + rng(gHi[0],gHi[1]) + ' 且 抑郁 ' + rng(pHi[0],pHi[1]),
        d:'焦虑与抑郁得分均较高',
        m:'建议尽快联系学校心理中心 / 专业机构进行一对一评估，并让一位你信任的人知道你现在的状态。' },
    2:{ t:'二级预警', c:'a-2', cls:'lv-warn',
        cond:'焦虑 ' + rng(gLo[0],gLo[1]) + ' 且 抑郁 ' + rng(pHi[0],pHi[1])
            + '，或 焦虑 ' + rng(gHi[0],gHi[1]) + ' 且 抑郁 ' + rng(pLo[0],pLo[1]),
        d:'焦虑与抑郁中有一项得分较高',
        m:'建议两周内与心理咨询师预约一次面谈，同时优先保证睡眠、规律三餐与适度运动。' },
    3:{ t:'三级预警', c:'a-3', cls:'lv-warn',
        cond:'焦虑 ' + rng(gLo[0],gLo[1]) + ' 且 抑郁 ' + rng(pLo[0],pLo[1]),
        d:'焦虑与抑郁得分均处于中等水平',
        m:'建议先做自我调适（作息、运动、社交），若两周后无改善，主动寻求心理咨询。' }
  };
}
var ALERT_STD = {};
buildAlertStd();

var TOKEN_KEY = 'psy_token_v1';   // 登录令牌存在浏览器本地，7 天有效
var Store = {
  /* 令牌读写：存 localStorage，关掉浏览器再打开仍然登录着 */
  token: function(){
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; }
  },
  setToken: function(t){
    try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e){}
  },
  _post: async function(action, data){
    var payload = data || {};
    var tk = this.token();
    if(tk) payload.token = tk;          // 自动带上令牌，后端据此识别身份
    var r;
    try{
      r = await fetch('/api/' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }catch(e){
      throw new Error('无法连接服务器，请检查网络后重试');
    }
    var res;
    try{ res = await r.json(); }catch(e){ throw new Error('服务器响应异常，请稍后重试'); }
    if(!res || !res.ok){
      if(res && res.msg === '登录已失效，请重新登录') this.setToken('');
      throw new Error((res && res.msg) || '请求失败');
    }
    return res;
  },
  _get: async function(action){
    var r;
    try{ r = await fetch('/api/' + action, { method:'GET' }); }
    catch(e){ throw new Error('无法连接服务器，请检查网络后重试'); }
    try{ return await r.json(); }catch(e){ throw new Error('服务器响应异常'); }
  },

  /* ---------- 学生端 ---------- */
  submit: function(rec){ return this._post('submit', { record: rec }); },
  /* 公开接口：拉取学校名单供学生选择（不含任何敏感信息） */
  schoolsPublic: async function(){
    var res = await this._get('schools/public');
    return (res && res.schools) || [];
  },
  /* 公开接口：一次拿到「题库 + 预警判定参数」，教育局改动后学生端即时生效 */
  config: async function(){
    var res = await this._get('config');
    if(!res || !res.ok) throw new Error((res && res.msg) || '配置加载失败');
    return res;
  },

  /* ---------- 登录 / 身份 ---------- */
  login: async function(u, p){
    var res = await this._post('login', { username:u, password:p });
    this.setToken(res.token);
    return res;                          // {role, school, username}
  },
  logout: async function(){
    try{ await this._post('logout', {}); }catch(e){}
    this.setToken('');
  },
  me: function(){ return this._post('me', {}); },
  pwdChange: function(oldPwd, newPwd){
    return this._post('pwd/change', { oldPwd:oldPwd, newPwd:newPwd });
  },

  /* ---------- 答卷 ---------- */
  list: async function(school){
    var res = await this._post('list', { school: school || '' });
    return res.data || [];
  },
  remove: function(id){ return this._post('remove', { id:id }); },
  clear: function(){ return this._post('clear', {}); },

  /* ---------- 量表与预警参数 ---------- */
  /* 公开接口：一次性取回量表定义（含题目）+ 当前预警参数 */
  config: async function(){
    var res = await this._get('config');
    return res || {};
  },
  /* 整表导入：key/name/short/intro/opt/items */
  scaleImport: function(data){ return this._post('scales/import', data); },
  scaleReset: function(key){ return this._post('scales/reset', { key:key }); },
  scaleDelete: function(key){ return this._post('scales/delete', { key:key }); },
  alertGet: function(){ return this._post('alert/get', {}); },
  alertSave: function(cfg){ return this._post('alert/save', { config:cfg }); },
  alertReset: function(){ return this._post('alert/reset', {}); },
  alertRecalc: function(){ return this._post('alert/recalc', {}); },

  /* ---------- 教育局端：学校账号管理 ---------- */
  schoolsList: async function(){
    var res = await this._post('schools/list', {});
    return res.data || [];
  },
  schoolsCreate: function(school, username, password){
    return this._post('schools/create', { school:school, username:username, password:password });
  },
  schoolsReset: function(id, password){
    return this._post('schools/reset', { id:id, password:password });
  },
  schoolsToggle: function(id, active){
    return this._post('schools/toggle', { id:id, active:active });
  },
  schoolsDelete: function(id, deleteData){
    return this._post('schools/delete', { id:id, deleteData: !!deleteData });
  }
};

  var sel = document.getElementById('inpSchool');

  var GRADES = ['小学一年级','小学二年级','小学三年级','小学四年级','小学五年级','小学六年级',
    '初一','初二','初三','高一','高二','高三','中职一年级','中职二年级','中职三年级','其他'];
  var CLASSES = [];
  for(var i = 1; i <= 30; i++) CLASSES.push(i + '班');
  CLASSES.push('其他');
  g.innerHTML = '<option value="">— 请选择年级 —</option>'
    + GRADES.map(function(x){ return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('');

  function loadSchoolOptions(){
    Store.schoolsPublic().then(function(list){
      state.schoolOptions = list || [];
      if(!list || !list.length){ useTextInput(); return; }
      sel.innerHTML = '<option value="">— 请选择你的学校 —</option>'

  function useTextInput(){
    sel.style.display = 'none';
    document.getElementById('schoolFallback').style.display = 'block';

    return (sel.style.display === 'none') ? txt.value.trim() : sel.value;
  }
  function go(){
    var sv = schoolValue(), nv = n.value.trim(), gv = g.value, cv = c.value;

function modeTip(){
  return '<div class="mode-tip mode-cloud">☁️ <b>在线模式</b>：答卷实时保存到服务器后台，管理员可在管理台统一查看、导出。</div>';
}

/* ==========================================================
   视图：问卷
   ========================================================== */
function viewQuiz(){
  state.view = 'quiz';
  document.getElementById('btnHome').style.display = 'none';
  appEl.innerHTML =
    '<div class="q-head">'
    +  '<div class="q-head-inner">'
    +    '<div class="q-title"><span class="dot"></span>心理健康问卷</div>'
    +    '<div class="q-who"><b>' + esc(state.user.name) + '</b> · ' + esc(state.user.school)
    +      ' · ' + esc(state.user.grade) + esc(state.user.klass) + '</div>'
    +  '</div>'
    +  '<div class="progress"><div class="progress-bar" id="pbar"></div></div>'
    + '</div>'
    + '<div class="q-body" id="qbody"></div>'
    + '<div class="q-foot">'
    +   '<button class="btn btn-ghost btn-sm" id="qPrev">上一步</button>'
    +   '<div class="hint" id="qhint"></div>'
    +   '<button class="btn btn-primary btn-sm" id="qNext">下一步</button>'
    + '</div>';

  document.getElementById('qPrev').addEventListener('click', function(){
    if(state.step > 0){ state.step--; renderQuiz(); }
  });
  document.getElementById('qNext').addEventListener('click', function(){
    var arr = state.answers[SCALES[state.step].key];
    var undone = arr.filter(function(v){ return v === null; }).length;
    if(undone){
      var h = document.getElementById('qhint');
      h.className = 'hint err';
      h.textContent = '还有 ' + undone + ' 题没作答，选完再继续～';
      var first = document.querySelector('.q-item:not(.answered)');
      if(first) first.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    /* 最后一组答完 → 直接提交（不再展示测评结果） */
    if(state.step >= SCALES.length - 1){ submitQuiz(); return; }
    state.step++;
    renderQuiz();
  });
  renderQuiz();
}

function renderQuiz(){
  var bar = document.getElementById('pbar');
  var bodyEl = document.getElementById('qbody');
  var hintEl = document.getElementById('qhint');
  var prevBtn = document.getElementById('qPrev');
  var nextBtn = document.getElementById('qNext');
  var total = SCALES.length;

  bar.style.width = ((state.step + 1) / total * 100) + '%';
  renderScale(bodyEl, hintEl);

  prevBtn.style.visibility = (state.step === 0) ? 'hidden' : 'visible';
  nextBtn.textContent = (state.step === total - 1) ? '提交问卷 ✓' : '下一步';
  var undone = state.answers[SCALES[state.step].key].filter(function(v){ return v === null; }).length;
  hintEl.className = 'hint';
  hintEl.textContent = undone ? ('还有 ' + undone + ' 题未作答') : '本组已完成 ✓';
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderScale(bodyEl, hintEl){
  var sc = SCALES[state.step];
  var arr = state.answers[sc.key];
  var html = '';

  /* 量表指导语：放在题目上方，说明作答的时间窗口与方式 */
  if(sc.intro){
    html += '<div class="scale-intro">' + esc(sc.intro) + '</div>';
  }

  /* PHQ-9 与 GAD-7 的评分窗口是「最近两周」，逐题题干前再强调一次，
     学生逐题作答时不会凭印象乱答。SWLS 测整体生活满意度，不加时间限定。 */
  var prefix = (sc.key === 'phq9' || sc.key === 'gad7') ? TIME_PREFIX : '';
  sc.items.forEach(function(text,i){
    var done = arr[i] !== null;
    html += '<div class="q-item' + (done?' answered':'') + '" data-i="' + i + '">'
      + '<div class="q-stem"><span class="q-no">' + (i+1) + '</span><span>'
      + esc(prefix + text) + '</span></div>'
      + '<div class="q-opts c-' + sc.opts.length + '">';
    sc.opts.forEach(function(o){
      html += '<div class="q-opt' + (arr[i] === o.v ? ' sel':'') + '" data-v="' + o.v + '">'
        + esc(o.t) + '</div>';
    });
    html += '</div></div>';
  });

  if(state.step === 0){
    html += '<div class="disclaim" style="margin-top:18px">'
      + '🔒 <b>隐私说明：</b>你的作答将与「学校 + 姓名」一起保存进后台，仅管理员可见，'
      + '用于整体心理健康状况的统计与预警筛查，<b>不会对外公开</b>。</div>';
  }
  bodyEl.innerHTML = html;

  bodyEl.querySelectorAll('.q-opt').forEach(function(opt){
    opt.addEventListener('click', function(){
      var item = opt.closest('.q-item');
      var i = parseInt(item.getAttribute('data-i'),10);
      var v = parseInt(opt.getAttribute('data-v'),10);
      arr[i] = v;
      item.classList.add('answered');
      item.querySelectorAll('.q-opt').forEach(function(o){ o.classList.remove('sel'); });
      opt.classList.add('sel');
      var undone = arr.filter(function(x){ return x === null; }).length;
      hintEl.className = 'hint';
      hintEl.textContent = undone ? ('还有 ' + undone + ' 题未作答') : '本组已完成 ✓';
    });
  });
}

/* ==========================================================
   提交（学生答完即提交，不再展示测评结果）
   ========================================================== */
async function submitQuiz(){
  var bodyEl = document.getElementById('qbody');
  if(!bodyEl) return;
  var nextBtn = document.getElementById('qNext');
  if(nextBtn){ nextBtn.disabled = true; nextBtn.textContent = '正在提交…'; }

  /* 原始作答按量表收集，分数交给后端统一计算，前端不展示结果 */
  var answers = {};
  SCALES.forEach(function(sc){
    answers[sc.key] = (state.answers[sc.key] || []).slice();
  });
  var rec = {
    school: state.user.school,
    name: state.user.name,
    grade: state.user.grade,
    klass: state.user.klass,
    answers: answers
  };
  try{
    await Store.submit(rec);
    state.view = 'done';
    document.getElementById('btnHome').style.display = 'none';
    appEl.innerHTML = '<div class="login-box"><div class="card" style="text-align:center">'
      + '<div style="font-size:3rem;margin-bottom:12px">🎉</div>'
      + '<h1 style="font-size:1.4rem;margin-bottom:10px">感谢你的填写</h1>'
      + '<p style="color:var(--text-light);margin-bottom:24px">'
      + '谢谢你，' + esc(state.user.name) + '。问卷已完成提交。<br>'
      + '记得照顾好自己，你比想象中更有力量 🌱</p>'
      + '<button class="btn btn-primary" id="btnAgain" style="max-width:260px;margin:0 auto">再填一份</button>'
      + '</div></div>';
    document.getElementById('btnAgain').addEventListener('click', viewLogin);
  }catch(e){
    if(nextBtn){ nextBtn.disabled = false; nextBtn.textContent = '重试提交 ✓'; }
    var hintEl = document.getElementById('qhint');
    if(hintEl){ hintEl.className = 'hint err'; hintEl.textContent = '提交失败：' + esc(e.message); }
    else { alert('提交失败：' + (e.message || e)); }
  }
}

function card(name, score, max, g, range){
  var pct = Math.round(score / max * 100);
  return '<div class="res-card">'
    + '<div class="rc-name">' + esc(name) + '</div>'
    + '<div class="rc-score" style="color:' + g.color + '">' + score + '<small> / ' + max + '</small></div>'
    + '<div class="rc-level ' + g.cls + '">' + esc(g.label) + '</div>'
    + '<div class="rc-bar"><i data-w="' + pct + '" style="width:0;background:' + g.color + '"></i></div>'
    + '<div class="rc-range">' + esc(range) + '</div></div>';
}

/* ==========================================================
   视图：管理后台
   ========================================================== */
function viewAdmin(){
  /* 已保存令牌 → 先回后台确认身份，免得每次都重新登录 */
  if(Store.token()){ restoreSession(); return; }
  renderLogin();
}

async function restoreSession(){
  try{
    var res = await Store.me();
    state.auth = { role: res.role, school: res.school || '', username: res.username || '' };
    state.adminOk = true;
    enterByRole();
  }catch(e){
    Store.setToken('');
    renderLogin(esc(e.message));
  }
}

/* 登录后按身份分流：教育局端看全区，学校端看本校 */
function enterByRole(){
  document.getElementById('btnHome').style.display = 'inline-block';
  if(state.auth.role === 'bureau'){ state.view = 'bureau'; loadBureau(); }
  else { state.view = 'admin'; loadRecords(); }
}

function renderLogin(errMsg){
  state.view = 'admin';
  state.adminOk = false;
  document.getElementById('btnHome').style.display = 'none';
  appEl.innerHTML = '<div class="login-box"><div class="card">'
    + '<div class="login-head"><h1>🔐 管理登录</h1><p>教育局端 / 学校端 统一入口</p></div>'
    + '<div class="field"><label>登录账号 <span class="req">*</span></label>'
    +   '<input class="input" id="inpUser" placeholder="如 admin" autocomplete="username"></div>'
    + '<div class="field"><label>密码 <span class="req">*</span></label>'
    +   '<input class="input" type="password" id="inpPwd" placeholder="请输入密码" autocomplete="current-password"></div>'
    + '<div class="err-tip" id="pwdErr">' + esc(errMsg || '') + '</div>'
    + '<button class="btn btn-primary" id="btnPwd">登录</button>'
    + '<div class="notice">🔑 <b>教育局端</b>默认账号 <code>admin</code>，'
    + '初始密码为部署时设置的 <code>ADMIN_PASSWORD</code>。<br>'
    + '🏫 <b>学校端</b>账号由教育局创建后下发，登录后只能看到本校学生的数据。</div>'
    + '</div></div>';

  var u = document.getElementById('inpUser');
  var p = document.getElementById('inpPwd');
  document.getElementById('btnPwd').addEventListener('click', doLogin);
  [u, p].forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  });
  u.focus();
}

async function doLogin(){
  var u = document.getElementById('inpUser').value.trim();
  var p = document.getElementById('inpPwd').value;
  var err = document.getElementById('pwdErr');
  if(!u || !p){ err.textContent = '请输入账号与密码'; return; }
  var btn = document.getElementById('btnPwd');
  btn.disabled = true; btn.textContent = '登录中…';
  try{
    var res = await Store.login(u, p);
    state.auth = { role: res.role, school: res.school || '', username: res.username || '' };
    state.adminOk = true;
    enterByRole();
  }catch(e){
    err.textContent = esc(e.message);
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function doLogout(){
  await Store.logout();
  state.adminOk = false; state.auth = null; state.records = []; state.schools = [];
  state.filterSchool = '';
  viewLogin();
}

async function loadRecords(){
  try{
    state.records = await Store.list(state.filterSchool || '');
    renderAdmin();
  }catch(e){
    if(!Store.token()){ renderLogin(esc(e.message)); return; }
    alert('加载失败：' + (e.message || e));
  }
}

    +   '共筛选出 <b>' + nAlert + '</b> 名预警学生'
    +   (total ? '（占全部答卷的 ' + pct + '%）' : '') + '。</div>'
    + '<div class="stat-grid">'
    +   '<div class="stat"><b style="color:var(--primary)">' + total + '</b><small>总答卷数</small></div>'
    +   '<div class="stat"><b style="color:var(--text)">' + nAlert + '</b><small>预警学生合计</small></div>'
    +   '<div class="stat"><b style="color:var(--risk)">' + n1 + '</b><small>一级预警</small></div>'
    +   '<div class="stat"><b style="color:#D97A45">' + n2 + '</b><small>二级预警</small></div>'
    +   '<div class="stat"><b style="color:#C98A22">' + n3 + '</b><small>三级预警</small></div>'
    + '</div>'
    + stdPanel();

  if(harm > 0){
    html += '<div class="crisis-box" style="margin-bottom:18px">'
      + '<h4>🆘 有 ' + harm + ' 份答卷涉及自伤念头</h4>'

    + '<button class="btn btn-ghost btn-sm" id="btnClearFilter">显示全部</button>'
    + '<button class="btn btn-ghost btn-sm" id="btnClearAll" style="color:var(--risk);border-color:rgba(228,106,106,.3)">清空本校数据</button>'
    + '</div>';

  if(!total){
    html += '<div class="table-box"><div class="empty">还没有收到答卷 📭<br>'
      + '<span style="font-size:.82rem">学生填写后会自动出现在这里</span></div></div>';
  }else{
    html += '<div class="table-box"><table><thead><tr>'
      + '<th>时间</th><th>姓名</th><th>PHQ-9</th><th>GAD-7</th><th>SWLS</th>'
      + '<th>抑郁</th><th>焦虑</th><th>满意度</th>'
      + '<th>自杀意念<br><span style="font-weight:400;opacity:.7">PHQ-9 第9题</span></th>'
      + '<th>预警</th><th></th>'
      + '</tr></thead><tbody id="recBody"></tbody></table></div>'
      + '<div class="foot-note">点击任意一行可查看该学生的<b>结果说明</b>与逐题作答<br>'
      + '「自杀意念」为 PHQ-9 第 9 题原始得分（0–3），<b>只要大于 0 就需立即跟进</b></div>';

  /* 表格单独抽出来，方便筛选时只重画 tbody，不用整页重刷 */
  function rowsHtml(rows){
    var s = '';
    rows.forEach(function(r){
      var tag = r.alertLevel
        ? '<span class="tag tag-' + r.alertLevel + '">' + r.alertLevel + '级</span>'
        : '<span class="tag tag-0">正常</span>';
      s += '<tr data-id="' + esc(r._id) + '">'
        + '<td>' + esc(fmtTime(r.createdAt)) + '</td>'
        + '<td><b>' + esc(r.name) + '</b>' + (r.selfHarm ? '<span class="badge-risk">自伤</span>' : '')

        + '<td>' + r.phq + '</td><td>' + r.gad + '</td><td>' + r.swlsScore + '</td>'
        + '<td>' + esc(r.phqLevel) + '</td><td>' + esc(r.gadLevel) + '</td><td>' + esc(r.swlsLevel) + '</td>'
        + '<td>' + selfHarmCell(r) + '</td>'
        + '<td>' + tag + '</td>'
        + '<td><button class="link-btn" data-del="' + esc(r._id) + '" style="color:var(--risk)">删除</button></td>'
        + '</tr>';
    });
    return s || '<tr><td colspan="11"><div class="empty">没有符合条件的学生</div></td></tr>';
  }
  function bindRows(){
    var box = document.getElementById('recBody');
    if(!box) return;
    box.querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.addEventListener('click', function(e){
        if(e.target.hasAttribute('data-del')) return;
        var id = tr.getAttribute('data-id');
        var rec = state.records.filter(function(x){ return String(x._id) === String(id); })[0];
        if(rec) showDetail(rec);
      });
    });
    box.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', async function(e){

  function paint(rows){
    var box = document.getElementById('recBody');
    if(!box) return;
    box.innerHTML = rowsHtml(rows);
    bindRows();

  /* 即时筛选：按姓名关键字 + 只看预警学生 */
  var kwEl = document.getElementById('inpSearch');
  var alertOnly = false;
  function applyFilter(){
    var kw = kwEl.value.trim().toLowerCase();
    paint(list.filter(function(r){
      if(alertOnly && !r.alertLevel) return false;
      if(kw){
        var hay = [r.name, r.grade, r.klass]
          .map(function(x){ return String(x || '').toLowerCase(); }).join(' ');
        if(hay.indexOf(kw) < 0) return false;
      }
      return true;
    }));

  if(kwEl){

      kwEl.value = ''; alertOnly = false;

  });
}

function showDetail(r){
  var modal = document.getElementById('modal');
  document.getElementById('mTitle').textContent = r.name + '　·　' + r.school;
  document.getElementById('mSub').textContent =
    fmtTime(r.createdAt) + '　|　PHQ-9 ' + r.phq + '　GAD-7 ' + r.gad + '　SWLS ' + r.swlsScore;

  var html = '';
  var shv = selfHarmScore(r);
  if(shv > 0){
    html += '<div class="crisis-box"><h4>🆘 存在自伤念头</h4>'
      + '<p>该题得分 <b>' + shv + '</b> 分。请优先跟进，建议尽快安排一对一谈话。</p></div>';
  }
  /* 自杀意念维度：单独拎出来展示，不埋在 9 道题里 */
  html += '<div class="advice"><h4>🚨 自杀意念维度（PHQ-9 第 9 题）</h4>'
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'
    +   '<span style="font-size:1.8rem;font-weight:800;color:'
    +     (shv > 0 ? 'var(--risk)' : 'var(--ok)') + '">' + shv + '</span>'
    +   '<span style="font-size:.9rem;color:var(--text-light)">/ 3 分　' + selfHarmText(shv) + '</span>'
    + '</div>'
    + '<p style="font-size:.86rem;color:var(--text-light);line-height:1.7">'
    + '题目原文：「' + esc('有过用某种方式伤害自己的念头。') + '」<br>'
    + '计分：0=没有，1=一天或几天，2=七天以上，3=几乎每天。'
    + (shv > 0 ? '<b style="color:var(--risk)">只要大于 0，无论总分高低都应立即安排一对一访谈。</b>' : '')
    + '</p></div>';
  html += '<div class="res-grid">'
    + card('抑郁 PHQ-9', r.phq, 27, {label:r.phqLevel, cls:lvOf(r.phqLevel), color:colorOf(r.phqLevel)}, '')
    + card('焦虑 GAD-7', r.gad, 21, {label:r.gadLevel, cls:lvOf(r.gadLevel), color:colorOf(r.gadLevel)}, '')
    + card('生活满意度', r.swlsScore, 35, {label:r.swlsLevel, cls:lvOf(r.swlsLevel), color:colorOf(r.swlsLevel)}, '')
    + '</div>';

  /* 结果说明：把分数翻译成可以直接照着做的话 */
  html += resultExplain(r);

  SCALES.forEach(function(sc){
    /* 作答优先取 answers（新结构），兼容旧记录的 phq9/gad7/swls 字段 */
    var arr = (r.answers && r.answers[sc.key]) ? r.answers[sc.key] : (r[sc.key] || []);
    /* 用答卷自带的题目快照：教育局后来导入量表，历史答卷仍按当时题面显示 */
    var texts = textsOf(r, sc.key);
    var n = Math.max(arr.length, texts.length);
    var raw = (r.rawSum && typeof r.rawSum[sc.key] === 'number') ? r.rawSum[sc.key] : null;
    var hasRaw = raw !== null;
    html += '<div class="detail-sec"><h5>' + esc(sc.short) + ' · ' + esc(sc.name)
      + '（' + n + ' 题'
      + (!sc.standard && n !== sc.base ? '' : (n !== sc.base ? '，标准 ' + sc.base + ' 题，已按比例折算' : ''))
      + (sc.standard ? '' : '　<span style="font-weight:400;color:var(--text-dim)">自定义量表</span>')
      + '）</h5>';
    if(hasRaw){
      html += '<div style="font-size:.82rem;color:var(--text-light);margin-bottom:8px">'
        + '原始合计 <b>' + raw + '</b> 分'
        + (sc.standard
            ? ' → 折算后 <b>' + (sc.key === 'phq9' ? r.phq : (sc.key === 'gad7' ? r.gad : r.swlsScore))
              + '</b> 分（满分 ' + sc.max + '）'
            : '（满分 ' + sc.max + '）')
        + '</div>';
    }
    for(var i = 0; i < n; i++){
      var v = arr[i];
      var t = texts[i] || ('（第 ' + (i+1) + ' 题，题面已删除）');
      var ot = v === null || v === undefined
        ? '未作答'
        : ((sc.opts.filter(function(o){ return o.v === v; })[0] || {}).t || '');
      html += '<div class="row"><i>' + (i+1) + '</i><span>' + esc(t) + '</span>'
        + '<b style="margin-left:auto;color:var(--primary)">'
        + (v === null || v === undefined ? '—' : v + '（' + esc(ot) + '）') + '</b></div>';
    }
    html += '</div>';
  });

  html += '<div style="margin-top:18px"><button class="btn btn-ghost btn-sm" id="mDel">删除这条记录</button></div>';
  document.getElementById('mBody').innerHTML = html;
  modal.classList.add('open');
  setTimeout(function(){
    document.querySelectorAll('#mBody .rc-bar i').forEach(function(b){ b.style.width = b.getAttribute('data-w') + '%'; });
  }, 60);

  document.getElementById('mDel').addEventListener('click', async function(){
    if(!confirm('确定删除这条答卷吗？')) return;
    try{
      await Store.remove(r._id);
      modal.classList.remove('open');
      loadRecords();
    }catch(e){ alert('删除失败：' + e.message); }
  });

/* ==========================================================
   自杀意念维度 = PHQ-9 第 9 题原始得分（0–3）
   0 分：无；≥1 分即表示出现过相关念头，需立即跟进
   ========================================================== */
function selfHarmScore(r){
  if(r && typeof r.selfHarmScore === 'number') return r.selfHarmScore;  // 后端已算好
  if(!r || !Array.isArray(r.phq9)) return 0;
  /* 兼容早期记录：按题面快照里「伤害自己」定位，找不到才回退到第 9 题 */
  var texts = textsOf(r, 'phq9');
  var idx = -1;
  for(var i = 0; i < texts.length; i++){
    if(/伤害自己|不如死掉/.test(texts[i])){ idx = i; break; }
  }
  if(idx < 0) idx = 8;
  var v = r.phq9[idx];
  return (typeof v === 'number' && isFinite(v)) ? v : 0;
}
function selfHarmText(v){
  return ['没有出现过此类念头',
          '一天或几天出现过',
          '七天以上出现过',
          '几乎每天都有'][v] || '—';
}
function selfHarmCell(r){
  var v = selfHarmScore(r);
  return v > 0
    ? '<span class="tag tag-' + (v >= 2 ? '1' : '2') + '">' + v + ' 分</span>'
    : '<span class="tag tag-0">0</span>';
}

/* ==========================================================
   结果说明：把分数翻成「人话」，学校端与教育局端共用同一份口径
   ========================================================== */
function adviceOf(key, level){
  var fn = key === 'phq9' ? gradePHQ : (key === 'gad7' ? gradeGAD : gradeSWLS);
  for(var s = 0; s <= 40; s++){
    var o = fn(s);
    if(o.label === level) return o.advice;
  }
  return '';
}

/* 图表实例要手动销毁，否则重画时 Canvas 会报错 */
var charts = [];
function killCharts(){
  charts.forEach(function(c){ try{ c.destroy(); }catch(e){} });
  charts = [];
}
function drawCharts(){
  killCharts();
  if(typeof Chart === 'undefined') return;
  var el1 = document.getElementById('cSchool'), el2 = document.getElementById('cLevel');
  if(!el1 || !el2) return;

  var bySchool = {};
  state.records.forEach(function(r){
    var k = r.school || '未填写';
    if(!bySchool[k]) bySchool[k] = { total:0, alert:0 };
    bySchool[k].total++;
    if(r.alertLevel) bySchool[k].alert++;
  });
  var keys = Object.keys(bySchool)
    .sort(function(a,b){ return bySchool[b].total - bySchool[a].total; })
    .slice(0, 15);

  charts.push(new Chart(el1, {
    type: 'bar',
    data: {
      labels: keys,
      datasets: [
        { label:'答卷数',   data: keys.map(function(k){ return bySchool[k].total; }), backgroundColor:'#5B8DEF', borderRadius:6 },
        { label:'预警人数', data: keys.map(function(k){ return bySchool[k].alert; }), backgroundColor:'#E46A6A', borderRadius:6 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom' }, title:{ display:true, text:'各校答卷数与预警人数' } },
      scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }
    }
  }));

  var n1 = state.records.filter(function(x){ return x.alertLevel === 1; }).length;
  var n2 = state.records.filter(function(x){ return x.alertLevel === 2; }).length;
  var n3 = state.records.filter(function(x){ return x.alertLevel === 3; }).length;
  var n0 = state.records.length - n1 - n2 - n3;

  charts.push(new Chart(el2, {
    type: 'doughnut',
    data: {
      labels: ['正常','三级预警','二级预警','一级预警'],
      datasets: [{ data:[n0, n3, n2, n1], backgroundColor:['#3FAE8F','#E9A23B','#D97A45','#E46A6A'] }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom' }, title:{ display:true, text:'全区预警等级构成' } }
    }
  }));
}

}

  /* 图表 */

    + '<div class="table-box" style="padding:14px"><div style="height:280px"><canvas id="cSchool"></canvas></div></div>'

    + '<th>学校名称</th><th>登录账号</th><th>状态</th><th>开通时间</th><th>操作</th>'
    + '</tr></thead><tbody>';

    html += '<tr><td colspan="5"><div class="empty">还没有开通任何学校账号</div></td></tr>';

    state.schools.forEach(function(s){
      html += '<tr>'
        + '<td><b>' + esc(s.school) + '</b></td>'
        + '<td><code>' + esc(s.username) + '</code></td>'
        + '<td>' + (s.active ? '<span class="tag tag-0">启用中</span>' : '<span class="tag tag-1">已停用</span>') + '</td>'

    + '</tr></thead><tbody id="recBody"></tbody></table></div>'

  function brows(rows){

    rows.forEach(function(r){

        + '<td>' + esc(r.school) + '</td>'
        + '<td><b>' + esc(r.name) + '</b>' + (r.selfHarm ? '<span class="badge-risk">自伤</span>' : '')
        +   '<div class="sub-line">' + esc(r.grade || '') + esc(r.klass || '') + '</div></td>'
        + '<td>' + r.phq + '</td><td>' + r.gad + '</td><td>' + r.swlsScore + '</td>'
        + '<td>' + selfHarmCell(r) + '</td>'
        + '<td>' + tag + '</td>'
        + '<td><button class="link-btn" data-del="' + esc(r._id) + '" style="color:var(--risk)">删除</button></td>'

    return s || '<tr><td colspan="9"><div class="empty">没有符合条件的数据</div></td></tr>';

  function bpaint(rows){
    var box = document.getElementById('recBody');
    if(!box) return;
    box.innerHTML = brows(rows);
    box.querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.addEventListener('click', function(e){
        if(e.target.hasAttribute('data-del')) return;

        var rec = state.records.filter(function(x){ return String(x._id) === String(id); })[0];
        if(rec) showDetail(rec);
      });
    });

      b.addEventListener('click', async function(e){
        e.stopPropagation();
        if(!confirm('确定删除这条答卷吗？')) return;
        try{ await Store.remove(b.getAttribute('data-del')); loadBureau(); }
        catch(err){ alert('删除失败：' + err.message); }
      });
    });
  }
  bpaint(list);

  var kwEl = document.getElementById('inpSearch');
  kwEl.addEventListener('input', function(){
    var kw = kwEl.value.trim().toLowerCase();
    bpaint(list.filter(function(r){
      if(!kw) return true;
      return String(r.name || '').toLowerCase().indexOf(kw) >= 0
          || String(r.school || '').toLowerCase().indexOf(kw) >= 0;

  document.getElementById('btnClearFilter').addEventListener('click', function(){

  document.getElementById('btnExport').addEventListener('click', exportCSV);

  document.getElementById('btnLogout').addEventListener('click', doLogout);

  /* ---------- 量表：整套导入 / 替换 / 恢复出厂 / 删除 ---------- */

    b.addEventListener('click', function(){ fillImport(b.getAttribute('data-sedit')); });
  });
  appEl.querySelectorAll('[data-sreset]').forEach(function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-sreset');
      var sc = scaleOf(key);
      if(!confirm('确定将「' + (sc ? sc.short + ' · ' + sc.name : key) + '」恢复为出厂题目吗？\n当前导入的题目会全部丢失。')) return;
      Store.scaleReset(key).then(loadBureau)
        .catch(function(e){ alert('操作失败：' + e.message); });
    });
  });
  appEl.querySelectorAll('[data-scaledel]').forEach(function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-scaledel');
      var sc = scaleOf(key);
      if(!confirm('确定删除自定义量表「' + (sc ? sc.short + ' · ' + sc.name : key) + '」吗？\n'
        + '该量表的题目会一并移除，已提交答卷中的作答仍会保留在记录里。')) return;
      Store.scaleDelete(key).then(loadBureau)
        .catch(function(e){ alert('删除失败：' + e.message); });
    });
  });

  var impSave = document.getElementById('impSave');
  if(impSave){
    impSave.addEventListener('click', async function(){
      var err = document.getElementById('impErr');
      err.textContent = '';
      var name  = document.getElementById('impName').value.trim();
      var short = document.getElementById('impShort').value.trim();
      var intro = document.getElementById('impIntro').value.trim();
      var opt   = document.getElementById('impOpt').value;
      var raw   = document.getElementById('impItems').value;
      var items = String(raw || '').split('\n').map(function(x){ return x.trim(); })
                    .filter(function(x){ return x.length; });
      var key   = document.getElementById('impKey').value.trim();

      if(!name){ err.textContent = '请填写量表名称'; return; }
      if(!items.length){ err.textContent = '请粘贴题目内容（每行一题）'; return; }
      if(!key){
        /* 新量表：用「英文简称/名称」生成一个稳定的 key */
        var seed = (short || name).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '');
        key = 'c_' + (seed || 'scale') + '_' + Date.now().toString(36).slice(-5);
      }
      impSave.disabled = true; impSave.textContent = '导入中…';
      try{
        await Store.scaleImport({ key:key, name:name, short:short || name, intro:intro, opt:opt, items:items });
        alert('导入成功，共 ' + items.length + ' 题。学生端下次打开即为新量表。');
        await loadBureau();

      document.getElementById('impItems').value =

         '我一想到考试就紧张不安。',
         '我觉得自己的努力得不到应有的回报。',
         '我担心成绩下滑会让家人失望。',

  /* ---------- 预警指标设置 ---------- */
  function collectCfg(){

      out[inp.getAttribute('data-cfg')] = inp.value;

  var cfgSave = document.getElementById('cfgSave');
  if(cfgSave){
    cfgSave.addEventListener('click', async function(){
      var err = document.getElementById('cfgErr');
      err.textContent = '';
      cfgSave.disabled = true; cfgSave.textContent = '保存中…';

        var res = await Store.alertSave(collectCfg());

        await loadBureau();
      }catch(e){
        err.textContent = esc(e.message);
        cfgSave.disabled = false; cfgSave.textContent = '💾 保存设置';
      }
    });
    document.getElementById('cfgReset').addEventListener('click', async function(){
      if(!confirm('确定恢复为系统默认的预警口径吗？')) return;
      try{
        var res = await Store.alertReset();
        if(res && res.config) applyAlertConfig(res.config);
        await loadBureau();
      }catch(e){ alert('操作失败：' + e.message); }
    });
    document.getElementById('cfgRecalc').addEventListener('click', async function(){
      if(!confirm('将按当前设置重新计算全部历史答卷的等级与预警级别。\n原始终止作答不会改变，仅重算分级结果。\n\n确定继续吗？')) return;

      }catch(e){
        alert('重算失败：' + e.message);

  /* 创建学校账号 */
  document.getElementById('nCreate').addEventListener('click', async function(){

  /* 学校账号：重置密码 / 停用启用 / 删除 */
  appEl.querySelectorAll('[data-reset]').forEach(function(b){
    b.addEventListener('click', function(){

        .catch(function(e){ alert('操作失败：' + e.message); });

  appEl.querySelectorAll('[data-toggle]').forEach(function(b){
    b.addEventListener('click', function(){
      var toOn = b.getAttribute('data-active') === '0';

      Store.schoolsDelete(b.getAttribute('data-sdel'), wipe)
        .then(loadBureau)
        .catch(function(e){ alert('操作失败：' + e.message); });
    });
  });

  drawCharts();
}

function lvOf(label){
  if(label.indexOf('不满意') >= 0) return 'lv-risk';           // 生活满意度低 = 风险
  if(label.indexOf('重度') >= 0)   return 'lv-risk';           // 重度 = 风险
  if(label.indexOf('无') === 0)    return 'lv-ok';             // 无抑郁 / 无焦虑
  if(label.indexOf('满意') >= 0)   return 'lv-ok';             // 对生活满意
  return 'lv-warn';                                            // 其余为中度 / 轻度 / 中性
}
function colorOf(label){
  return { 'lv-ok':'#3FAE8F', 'lv-warn':'#E9A23B', 'lv-risk':'#E46A6A' }[lvOf(label)];
}

});

});

/* ---------- 导出 CSV ---------- */
function exportCSV(){
  var list = state.records;
  if(!list.length){ alert('暂无数据可导出'); return; }
  var head = ['提交时间','学校','年级','班级','姓名','PHQ9总分','GAD7总分','SWLS总分',
    '抑郁等级','焦虑等级','满意度等级','自杀意念','预警级别','自伤念头'];
  /* 自定义量表各自一列总分 */
  SCALES.forEach(function(sc){ if(!sc.standard) head.push(sc.short + '总分'); });
  /* 题目数可能因教育局导入量表而与标准不同，列数取全部答卷里的最大值 */
  var maxN = {};
  SCALES.forEach(function(sc){ maxN[sc.key] = 0; });
  function ansOf(r, key){
    return (r.answers && r.answers[key]) ? r.answers[key] : (r[key] || []);
  }
  list.forEach(function(r){
    SCALES.forEach(function(sc){
      var n = Math.max(ansOf(r, sc.key).length, textsOf(r, sc.key).length);
      if(n > maxN[sc.key]) maxN[sc.key] = n;
    });
  });
  SCALES.forEach(function(sc){
    for(var i = 0; i < maxN[sc.key]; i++) head.push(sc.short + '-' + (i+1));
  });
  var rows = [head];
  list.forEach(function(r){
    var row = [ fmtTime(r.createdAt), r.school, r.grade || '', r.klass || '', r.name,
      r.phq, r.gad, r.swlsScore,
      r.phqLevel, r.gadLevel, r.swlsLevel,
      selfHarmScore(r),
      r.alertLevel ? (r.alertLevel + '级') : '正常',
      r.selfHarm ? '是' : '否' ];
    SCALES.forEach(function(sc){
      if(!sc.standard){
        var e = (r.extra && r.extra[sc.key]) ? r.extra[sc.key].raw : '';
        row.push(e);
      }
    });
    SCALES.forEach(function(sc){
      var arr = ansOf(r, sc.key);
      for(var i = 0; i < maxN[sc.key]; i++){
        row.push(i < arr.length ? arr[i] : '');
      }
    });
    rows.push(row);
  });
  var csv = rows.map(function(row){
    return row.map(function(c){
      c = String(c == null ? '' : c);
      return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
    }).join(',');
  }).join('\n');

  var blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '心理健康问卷数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

    initAnswers();
  }).catch(function(){ /* 取不到就用内置默认量表与默认阈值 */ initAnswers(); })
   .then(viewLogin);
}
